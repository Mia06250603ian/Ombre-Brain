# ============================================================
# 许晏系统 · 每日体检
#
# 为什么要有(按真事故排的):OPERATIONS.md 里最贵的三次事故有同一个特征
#   —— **全线零报警,都是所有者自己发现的**:
#     08-11 订阅 OAuth 过期 → 断约 3 小时      08-12 缓存被抢 → 白烧一天半
#     08-19 Node 250ms 闸门 → 空回
#   要治的从来不是「它会坏」,而是「坏了没人吭声」。
#
# 怎么报警:脚本非 0 退出 → 这次运行变红 → **GitHub 自动给仓库主人发邮件**。
#   **刻意不走 Telegram**:出事时往往正是 Telegram 那条路不通(08-19 就是),
#   而且往 Actions 里塞 bot token 等于多一处密钥。
#   所有检查都用**无鉴权的只读口,零密钥**。
#
# 跑在 GitHub 上而不是那台机器上 —— 这是**刻意的**:
#   看门狗必须站在被看的东西外面。整台机器挂了的时候,跑在机器里的狗也一起哑了。
#
# 节拍:先每天一次(北京时间 10:00),**用来观察会不会误报**。
#   确认几天不乱叫之后,把 cron 改成 '0 * * * *' 就是每小时 —— 那样才抓得住
#   08-11 那种「断三小时」。**先慢后快,是因为一个乱叫的看门狗比没有更糟。**
# ============================================================
name: Daily Healthcheck

on:
  schedule:
    - cron: '0 2 * * *'      # UTC 02:00 = 北京时间 10:00
  workflow_dispatch:          # 网页上的手动按钮(本文件进了 main 才会出现)
  push:
    branches: [main]
    paths:
      - '.github/scripts/healthcheck.py'
      - '.github/workflows/healthcheck.yml'

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 脚本只用标准库,**刻意不装任何依赖** ——
      # 看门狗要是会被某个包的升级搞挂,那它反而成了新的故障源(07-29 就是依赖引发的)。
      - name: 体检
        run: python3 .github/scripts/healthcheck.py
