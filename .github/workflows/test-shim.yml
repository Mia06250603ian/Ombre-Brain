# ============================================================
# kelivo-shim(晏本体那一层)的单测(2026-09-30 新增)
#
# 为什么加:shim 的单测(十一套)此前**从没进过 CI**,全靠部署前有人记得手动敲
#   (shim 手册《部署检查单》第 2 条)。2026-09-01 就漏过一回:test-toolvis.mjs 加了却没进那行,
#   之后每次部署都少跑一套,直到 09-12 才发现。机器不会漏。
#
# 只跑单测,不跑 e2e:e2e 要下载 claude 二进制、起真进程,又慢又依赖网络,
#   仍按检查单部署前手动跑。单测只用 Node 自带模块(2026-09-30 核过:零第三方 import),不用 npm install。
#
# ⚠️ 下面 for 循环按文件名通配 `test-*.mjs` 跑,**新加一套单测不用改这里**(就是为了不再重演 toolvis 那次)。
# Node 版本钉 22:与线上容器同一个大版本(同 test-bridge.yml)。
# 触发:只在 kelivo-shim/ 或本文件变动时跑,不惊动 OB 那条构建流程。
# ============================================================
name: Shim Tests

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'kelivo-shim/**'
      - '.github/workflows/test-shim.yml'
  pull_request:
    branches: [main]
    paths:
      - 'kelivo-shim/**'
      - '.github/workflows/test-shim.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run shim unit tests
        working-directory: kelivo-shim
        run: |
          fail=0; n=0
          for t in test-*.mjs; do
            n=$((n+1))
            echo "::group::$t"
            if node "$t"; then echo "✅ $t"; else echo "❌ $t"; fail=$((fail+1)); fi
            echo "::endgroup::"
          done
          echo "$n 套单测,$fail 套失败"
          [ "$n" -ge 11 ] || { echo "单测少于 11 套 —— 有文件被删了或改了名?"; exit 1; }
          [ "$fail" -eq 0 ]
