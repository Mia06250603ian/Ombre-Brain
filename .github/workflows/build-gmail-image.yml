# ============================================================
# gmail-mcp 镜像构建
#
# 为什么要有这个:这个 Zeabur 账号**禁止平台内构建**(ears 和 browser-hands 都栽过),
# 所以镜像必须在 GitHub Actions 里构建、推到镜像仓库,Zeabur 那边拉现成的。
#
# 为什么推 ghcr 而不是 Docker Hub(2026-08-06 实翻的车,记下来别再试):
#   第一版照本仓库已有的 docker-publish.yml 推 Docker Hub,**登录那步当场失败**——
#   `Mia06250603ian/Ombre-Brain` 是 **fork 来的仓库,上游的 secrets 不会跟着 fork 过来**,
#   所以这里根本没有 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN。
#   (顺带:同一个原因,仓库里那份 docker-publish.yml 在这个 fork 上多半也是一直失败的。)
#   ghcr 用 Actions 内置的 GITHUB_TOKEN,**不需要任何额外密钥**,和 browser-hands / ears 一路。
#
# ⚠️ ghcr 的包默认是私有的。Zeabur 要免凭据拉,得把这个包设成 Public
#    (GitHub → 头像 → Packages → gmail-mcp → Package settings → Change visibility)。
#    构建完先用匿名身份验一次能不能拉,别只看 Actions 绿了就当上线
#    (browser-hands 手册第 6 节的教训)。
#
# 触发:只在 gmail-mcp/ 或本文件变动时跑,不影响 OB 自己的构建流程。
#   main 分支    → :latest 和 :<sha>
#   claude/** 分支 → :dev 和 :<sha>(没验过的分支构建不许占 :latest)
# ============================================================

name: Build & Push gmail-mcp Image

on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'gmail-mcp/**'
      - '.github/workflows/build-gmail-image.yml'
  workflow_dispatch:      # 手动触发(注意:要本文件先进了 main 才会出现这个按钮)

jobs:
  # --- 先跑单测,红的就不构建 ---
  # 照 kelivo-shim 的规矩:单测全绿才谈部署。
  # 这两份测试不碰网络、不需要任何凭据,几秒钟跑完。
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r gmail-mcp/requirements.txt

      - name: Run tests (167 项,不碰网络)
        working-directory: gmail-mcp
        run: |
          python test_mailfilter.py
          python test_server.py

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # 推 ghcr 需要这一条,别删
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Actions 内置,不用自己配

      # main → latest;其他分支 → dev。没验过的构建不许顶掉 latest。
      - name: Decide tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "moving=latest" >> "$GITHUB_OUTPUT"
          else
            echo "moving=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./gmail-mcp
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/mia06250603ian/gmail-mcp:${{ steps.tag.outputs.moving }}
            ghcr.io/mia06250603ian/gmail-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 说明
        run: |
          echo "镜像已推送:ghcr.io/mia06250603ian/gmail-mcp:${{ steps.tag.outputs.moving }}"
          echo "⚠️ ghcr 包默认私有,Zeabur 免凭据拉之前要先把它设成 Public。"
          echo "Zeabur 用 PREBUILT_V2 模板拉这个标签即可(该账号禁止平台内构建)。"
