name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'backup_*/**'
      - '.gitignore'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run local tests (no API key needed)
        # 2026-09-30 起跑整个 tests/(不再一个个点名):以前点名的列表漏了回收站、信箱、便利贴、相似对那几套,
        # 其中回收站那套一起跑会红(事件循环被前面的用例收掉),已修。三个 *-e2e/ 与 dashboard-ui 是浏览器测试,另有跑法。
        # 要 key 的 test_llm_quality.py 在没有 key 时自己会 skip,有 key 的那步在下面单独跑。
        run: python -m pytest tests/ -v --asyncio-mode=auto --ignore=tests/dashboard-ui --ignore=tests/galaxy-e2e --ignore=tests/turbulence-e2e --ignore=tests/test_llm_quality.py

      - name: Run LLM quality tests
        if: env.OMBRE_API_KEY != ''
        env:
          OMBRE_API_KEY: ${{ secrets.OMBRE_API_KEY }}
        run: python -m pytest tests/test_llm_quality.py -v --asyncio-mode=auto
