<!-- ═══════════════════════════════════════════════════════════
     记忆乱流 · Memory Drift(2026-09-03 建)
     把 OB 的记忆桶画成一片持续上飘的字符场:每个桶一个字符,越亮越靠前;
     手指/鼠标凑近 → 附近那几颗之间的相似度连线亮起来;点一颗锁住 → 正文浮现。

     配套 server.py 的 /turbulence 路由(约 20 行,只发这个文件),架构照 /galaxy 那套:
     ⚠️ **只读,而且刻意做成「OB 优先」**:
       - 这条路由只发一个静态文件,不读桶、不写桶、不起后台任务;
       - 数据全走**已有的**三条接口:/api/buckets(铺场)、/api/network(连线)、
         /api/bucket/{id}(点中才取正文)。**没有为它新增任何接口**;
       - 页面开一次 = 一次 /api/buckets + 一次 /api/network;**不轮询、不定时刷新**;
       - 登录复用 OB 自己的 /auth/login 和那块 ombre_session cookie,和记忆库后台同一把锁;
       - 这里出任何岔子都就地兜住,只影响这一页,碰不到 /mcp。
     细节和验证记录见 INTERNALS.md 第 1.12 节。
     ⚠️ 文件要在 Dockerfile 里 COPY,不然线上 404 而本地正常(同 galaxy.html 那个坑,见 1.9)。

     ── 这段视觉是从哪来的 ────────────────────────────────
     照 Mia06250603ian/fuyue(赴约)的 packages/ui/src/memory-constellation.tsx 重写。
     那个包单独采用 MIT,与本仓库兼容;**原文是 React + lucide + esbuild,这里用普通 JS
     重写了一遍**,因为这个后台不引外部依赖。⚠️ 别去抄 fuyue 的 apps/ 那部分 —— 那是 AGPL。

     ── 和原版刻意不一样的三处(别当成抄漏了,理由见 INTERNALS 1.12) ──
     ① 原版记忆不足 144 条时,把同一条记忆复制成多个「投影」凑数,于是连线要在
        投影之间找最近的那个,代码复杂一大截。这里改成**填充不可点的装饰字符**:
        它们不参与连线、不可选中、更暗。她 400+ 个桶本来就用不到填充。
     ② 原版的边分 explicit/source/tag/vector 四种、按种类定优先级。OB 的边只有一种
        (向量相似度),所以改成**按相似度从高到低**定优先级。
     ③ 原版按 core/semantic/episodic/working/archive 分层定颜色和字号。OB 没有这套分层,
        改成按**桶的 type + pinned + resolved** 映射,见下面 layerOf()。
     ═══════════════════════════════════════════════════════════ -->

<!-- ═══════════════════════════════════════════════════════════
     ① CONFIG —— 只改这里就能调这片场
     ═══════════════════════════════════════════════════════════ -->
<script>
const CONFIG = {
  // ── 上方那两行字 ──────────────────────────────────
  title:    'Drift',
  subtitle: '记忆乱流',

  // ── 记忆从哪来(全是已有的只读 GET,靠你自己浏览器里的登录)──
  obSource:  true,
  obBuckets: 'api/buckets',        // 铺场:每个桶一个字符
  obNetwork: 'api/network',        // 连线:桶之间的相似度边(相似度 >0.5,每桶封顶 6 条)
  obDetail:  'api/bucket/',        // 正文:点中一颗才取

  // ── 哪些桶要变成字符 ────────────────────────────────
  includeFeel:    true,            // 晏自己的 feel 桶
  includeResolved:true,            // 已了结/衰减的桶(会画得更暗)

  // ── 调参 ────────────────────────────────────────
  minGlyphs:      144,             // 场里至少多少个字符,不够拿装饰字符填(原版的视觉下限)
  // ⚠️ 一屏想看见多少个字符。**这条决定「密不密」**(所有者 2026-09-03:「感觉他们一进去
  // 的代码也比我们密集」)。~~原版是 sqrt(总数/144),377 个桶算出来世界是一屏的 2.6 倍,
  // 等于一屏只看得见 145 个,显得稀~~。现在按这个数反推世界大小,一屏就看得见这么多。
  // 调大 = 更密(但每个字符更挤),调小 = 更疏、可拖动的范围更大。
  visibleGlyphs:  300,
  tagGroupMax:    28,              // 一个标签底下超过这么多桶就当它太泛,不连线(「日常」那种)
  tagEdgesPerNode: 4,              // 每个桶最多留几条「共享标签」的线
  // ⚠️ 横向铺开的力度(2026-09-03 所有者:「乱码都集中在中间」)。
  // 0 = 不铺(会塌回中间那一坨),1 = 完全按名次铺平(簇会被抹掉,不要)。做法见 makeGraph 末尾。
  spreadX:        0.62,
  driftSpeed:     0.004725,        // 上飘速度(0 = 不飘)
  interactRadius: 110,             // 手指/鼠标多近才算「凑近了」(px)
  neighborCount:  4,               // 凑近时照亮最近几颗
  glyphs:         'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%*()[]{}',

  // ⚠️ 颜色不在这儿 —— 全在下面 <style> 的 :root 里,分浅色/深色两套,跟着系统走。
  // 画布里的颜色一律靠 palette() 现读那些变量,**别写死在 JS 里**
  // (这是后台那边就定下的规矩,见 INTERNALS 1.8「画布里的颜色一律 cssVar() 现读」)。
};
</script>

<style>
  /* ═══════════════════════════════════════════════════════════
     颜色:浅色写在 :root,深色只覆盖变化的那几条,**跟着系统走**。
     做法和 dashboard.html 一样(见 INTERNALS 1.8):官端灰阶原文 + 一张角色表;
     画布那几个颜色也在这儿,JS 靠 palette() 现读 —— **别把颜色写死在 JS 里**,
     写死了切到浅色画出来还是深色那套。
     ⚠️ signal 的两个值是 fuyue 原版自己那对(深色 205,105,111 / 浅色 122,52,55),
     不是后台那个中性灰强调色 —— 这一页有自己的调子,别去"统一"。
     ═══════════════════════════════════════════════════════════ */
  :root {
    color-scheme: light;
    /* ── 官端灰阶原文(只取这一页用得到的几档)── */
    --color-gray-000:#fff;     --color-gray-050:#faf9f5;  --color-gray-100:#f5f4ed;
    --color-gray-200:#e8e6dc;  --color-gray-300:#d1cfc5;  --color-gray-500:#87867f;
    --color-gray-600:#5e5d59;  --color-gray-750:#30302e;  --color-gray-900:#1a1918;
    --color-gray-950:#141413;

    /* ── 画布(JS 现读这三条)── */
    --drift-bg:     var(--color-gray-050);  /* 场的底色 */
    /* 高亮的字 + 连线 + 卡片上那些小标题(rgb 三个数,别带 rgb())。
       ⚠️⚠️ **这两个值是所有者 2026-09-03 在全色域取色器上亲手拖出来的**,不是算的、也不是我挑的:
       **深 `rgb(150,180,253)`(偏蓝紫)/ 浅 `rgb(144,206,216)`(偏青)**。
       ~~原来是 fuyue 原版那对玫瑰红 205,105,111 / 122,52,55~~;
       ~~中途我自作主张换过一版低饱和蓝 125,153,185 / 61,85,113~~ —— 她看了说「不是这种蓝」。
       ⚠️ **两套刻意不是同一个色相**(深色偏紫、浅色偏青),**这是她拖出来的结果,别去"统一"**。
       ⚠️ **坠线不跟着变** —— 那是单独的 `--drift-trace`,中性灰是她另外定的。
       要再调:照 `INTERNALS.md` 1.12《怎么再调一次》那条,给她一个取色器,别自己挑。 */
    --drift-signal: 144,206,216;
    /* 往下坠的那些光迹**单独一条**(2026-09-03 所有者要求拆开的,原本和 signal 共用一个值)。
       颜色和浓度都跟连线、高亮无关,改这儿只动坠线。
       ⚠️ **中性灰是所有者 2026-09-03 在校准台上自己拖出来的**,不是从 signal 派生的,
       别按「和 signal 统一」改回玫瑰红。 */
    --drift-trace:       110,108,102;
    --drift-trace-boost: 0.85;
    --drift-node:   94,93,89;               /* 平时那些字符(= 官端 gray-600) */
    /* ⚠️ 字符的浓度。原版那套透明度(.28~.45)是给深底设计的,深色下正好;
       同样的值压在浅底上会淡一截,所以浅色这边乘一个系数。**这个数是所有者看图定的**,
       别按「和深色统一」的理由改回 1(2026-09-03,给她看了 1.0 和 1.5 两版)。 */
    --drift-ink-boost: 1.4;

    /* ── 页面上的那些框框 ── */
    --drift-ink:    var(--color-gray-950);
    --drift-dim:    var(--color-gray-600);
    --drift-faint:  var(--color-gray-500);
    --drift-line:   var(--color-gray-300);
    --drift-panel:  rgba(255,255,255,.9);
    /* ⚠️ 详情卡是**玻璃**(2026-09-03 所有者:「这个页面也改成玻璃质感」)。
       ~~原来 `rgba(250,249,245,.94)` 几乎不透,底下的字符雨一点都透不上来 = 一张白纸~~。
       现在压到看得见字符雨、又不糊正文的程度;再配 sheen/rim/depth 三件(见 #card)。
       ⚠️ **别调回 .9 以上**,一实就没玻璃了(和后台 1.8「实色卡片是没有玻璃的」同一条)。 */
    --drift-card:   rgba(252,251,247,.60);
    --card-sheen:
      radial-gradient(130% 90% at 6% -24%, rgba(255,255,255,.55), rgba(255,255,255,.12) 40%, transparent 68%),
      linear-gradient(180deg, rgba(255,255,255,.22) 0%, transparent 20%);
    --card-rim: linear-gradient(122deg,
      rgba(255,255,255,.95) 0%, rgba(255,255,255,.45) 22%,
      rgba(19,19,19,.05) 60%, rgba(255,255,255,.5) 100%);
    --card-depth: inset 0 14px 22px -18px rgba(255,255,255,.9), inset 0 -1px 0 rgba(19,19,19,.04);
    /* 正文那块玻璃:比卡片底再亮一档,浅色靠白、深色靠白的一点点透明度 */
    --drift-sheet:  rgba(255,255,255,.62);
    --drift-input:  rgba(20,20,19,.03);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --drift-bg:     #01050a;
      --drift-signal: 150,180,253;
      --drift-trace:       130,138,148;
      --drift-trace-boost: 1.55;
      --drift-node:   116,128,141;
      --drift-ink-boost: 1.85;           /* 原版那套压在这个底上她说太暗,校准台上拖到 1.85 */
      --drift-ink:    #eef2f7;
      --drift-dim:    #aeb6c0;
      --drift-faint:  #8b939d;
      --drift-line:   #252b32;
      --drift-panel:  rgba(4,7,11,.9);
      /* 深色玻璃:底本来就深,面要更透才看得出后面有字符雨(同后台 1.8 深色那条) */
      --drift-card:   rgba(6,10,16,.52);
      --card-sheen:
        radial-gradient(130% 90% at 6% -24%, rgba(255,255,255,.10), rgba(255,255,255,.03) 40%, transparent 68%),
        linear-gradient(180deg, rgba(255,255,255,.05) 0%, transparent 22%);
      --card-rim: linear-gradient(122deg,
        rgba(255,255,255,.42) 0%, rgba(255,255,255,.14) 24%,
        rgba(0,0,0,.22) 60%, rgba(255,255,255,.2) 100%);
      --card-depth: inset 0 14px 24px -18px rgba(255,255,255,.28), inset 0 -1px 0 rgba(0,0,0,.5);
      --drift-sheet:  rgba(255,255,255,.045);
      --drift-input:  rgba(255,255,255,.03);
    }
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--drift-bg); }
  body {
    color:var(--drift-ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #stage { position:fixed; inset:0; }
  #canvas { display:block; width:100%; height:100%; touch-action:none; cursor:crosshair; }

  /* 顶上那两行字 */
  #head {
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 18px); left:0; right:0;
    text-align:center; pointer-events:none; z-index:3;
  }
  #head h1 {
    font-family:ui-serif,Georgia,"Times New Roman",serif;
    font-size:19px; font-weight:400; letter-spacing:.34em; text-indent:.34em;
    color:var(--drift-ink);
  }
  #head p { margin-top:5px; font-size:10px; letter-spacing:.22em; text-indent:.22em; color:var(--drift-faint); }

  /* 左上角的出口:回记忆库后台。
     ⚠️ **这颗必须有** —— 这一页可以被加到手机主屏,那种模式下 Safari 那圈壳没了、
     **连返回按钮都没有**,没它就只能杀掉重开。
     ⚠️ **所有者 2026-09-03 要「做成隐藏的」**(和 `/galaxy` 那颗同一个做法):
     不做成按钮,只留一个很淡的箭头,碰到才亮。~~此前做成过玻璃胶囊~~ —— **已撤销,别改回去**。
     ⚠️ **看着淡不等于难按**:热区仍然是 44×44。
     ⚠️ 用 `<a>` 不用 JS 跳转:点了才走,不带来任何请求。 */
  #exit {
    position: fixed; z-index: 3;
    top: calc(env(safe-area-inset-top,0px) + 10px);
    left: calc(env(safe-area-inset-left,0px) + 8px);
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;
    color: var(--drift-dim); text-decoration: none; opacity: .34;
    transition: opacity .35s ease;
  }
  #exit:hover, #exit:focus-visible { opacity: 1; outline: none; }
  #exit svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  #head p#hStat { margin-top:7px; font-size:10px; letter-spacing:.1em; color:var(--drift-faint); }
  #legend {
    margin-top:9px; display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:9.5px; letter-spacing:.06em; color:var(--drift-faint);
  }
  #legend span { display:inline-flex; align-items:center; gap:7px; }
  #legend i { width:26px; height:0; border-top:1px solid currentColor; display:inline-block; }
  #legend i.l-dash { border-top-style:dashed; }
  #legend b { font-weight:inherit; font-variant-numeric:tabular-nums; }
  /* 收起:占位不留(visibility 收掉,免得读屏还念它);展开时那两根线自己划出来 */
  #legend { opacity:0; visibility:hidden; transform:translateY(-3px);
            transition:opacity .32s ease, transform .32s cubic-bezier(.23,1,.32,1), visibility 0s .32s; }
  #legend.on { opacity:1; visibility:visible; transform:none; transition-delay:0s; }
  #legend i { width:0; transition:width .42s cubic-bezier(.23,1,.32,1) .06s; }
  #legend.on i { width:26px; }
  @media (prefers-reduced-motion: reduce) {
    #legend, #legend i { transition-duration:.01s; }
  }
  /* 底部那句引导。点过一次就淡出去 —— 说明只在你还不知道怎么用的时候才有用。 */
  #hint {
    position:fixed; left:0; right:0; z-index:2; text-align:center; pointer-events:none;
    bottom:calc(env(safe-area-inset-bottom,0px) + 62px);
    font-size:11px; letter-spacing:.16em; color:var(--drift-faint);
    transition:opacity .8s ease;
  }
  #hint.gone { opacity:0; }

  /* 右下角三颗按钮。
     ⚠️ 左下角原来还有一块「30 FPS | 1.00×」的读数(`#meter`),
     **2026-09-03 所有者点名删掉了**(「下方的 30fps 1.00x 那一行能不能删掉」)。
     它是给开发看的,对她没用。**别照旧文加回来**;演练里量「动画在转 / 缩放生效」
     改成读 `window.__drift` 的 `frames()` 和 `scale()`,不再依赖屏幕上有这块读数。 */
  .hud {
    position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 14px); z-index:3;
    font-family:"SFMono-Regular",Menlo,Consolas,monospace; font-size:10px; letter-spacing:.08em;
  }
  #controls { right:14px; display:flex; gap:5px; }
  #controls button {
    width:38px; height:38px; display:grid; place-items:center;
    border:1px solid var(--drift-line); border-radius:7px; background:var(--drift-panel);
    color:var(--drift-dim); font-size:15px; font-family:inherit; cursor:pointer;
    transition:transform .14s cubic-bezier(.23,1,.32,1), border-color .14s ease, color .14s ease;
  }
  #controls button:hover, #controls button:focus-visible {
    border-color:rgba(var(--drift-signal),.5); color:var(--drift-ink); outline:none;
  }
  #controls button:active { transform:scale(.97); }

  /* 点中一颗之后从底下浮上来的那张卡。
     ⚠️ 这是**玻璃**(2026-09-03 所有者:「这个页面也改成玻璃质感」),六件事凑齐:
     半透明面(--drift-card)+ 光泽(--card-sheen)+ 模糊放大到 30px + 边缘高光(::before)
     + 厚度(::after)+ 背后真有东西(这一页满屏的字符雨)。做法和后台 1.8 那套一致。
     ⚠️ `background-color` 走面、`background-image` 走光泽,别用 `background` 简写把两者合掉。 */
  #card {
    position:fixed; left:0; right:0; bottom:0; z-index:4;
    max-height:66vh; padding:20px 18px calc(env(safe-area-inset-bottom,0px) + 18px);
    display:none; grid-template-rows:auto 1fr; gap:11px;
    border-top:1px solid transparent; border-radius:16px 16px 0 0;
    background-color:var(--drift-card); background-image:var(--card-sheen);
    backdrop-filter:blur(30px) saturate(1.4); -webkit-backdrop-filter:blur(30px) saturate(1.4);
    box-shadow:var(--card-depth);
    animation:rise .18s cubic-bezier(.23,1,.32,1) both;
  }
  /* 边缘高光:一圈渐变的 1px 环(mask 抠出来的),不是描边;支持不了 mask 就退回上面那圈透明 border。
     ⚠️ 只有顶边和两个顶角露在屏幕里(底部弹层),环画满也无妨,顶部读起来就是玻璃的那道"唇"。 */
  #card::before, #card::after { content:''; position:absolute; pointer-events:none; }
  #card::before {
    inset:0; border-radius:inherit; z-index:0;
  }
  @supports ((-webkit-mask-composite:xor) or (mask-composite:exclude)) {
    #card::before {
      inset:-1px; padding:1px; background:var(--card-rim);
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor; mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite:exclude;
    }
  }
  /* 卡里的内容压在高光之上(高光只在边上,本来也不碍着字) */
  #card > * { position:relative; z-index:1; }
  /* 玻璃透不了时(不支持 backdrop-filter / 系统开了「降低透明度」)退回实色,不然糊字 */
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
    #card { background-color:var(--drift-panel); background-image:none; }
  }
  @media (prefers-reduced-transparency:reduce) {
    #card { background-color:var(--drift-panel); background-image:none; }
  }
  /* ⚠️ 这三个 min-width/minmax(0,…) 是**堵溢出**的,别删(2026-09-03 所有者报的:
     标题是 `session_2026-07-01_…` 那种超长名字时,整张卡被撑出屏幕、右上角的 ✕ 被挤没了)。
     病根是 CSS 的默认行为:**网格/弹性盒里的格子最小宽度是「内容宽度」**,
     而标题是 `white-space:nowrap` 的 —— 于是"最小宽度"就是整条标题的长度,撑破容器。
     `minmax(0,1fr)` / `min-width:0` 就是把这个下限解开,让省略号真的生效。 */
  #card.on { display:grid; grid-template-columns:minmax(0,1fr); }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  #card header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; min-width:0; }
  #card header > div { min-width:0; }
  #cKind {
    display:block; color:rgb(var(--drift-signal));
    font-family:"SFMono-Regular",Menlo,Consolas,monospace; font-size:8px; letter-spacing:.14em;
  }
  #cName {
    margin-top:4px; font-size:17px; font-weight:600; line-height:1.35;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  /* ⚠️ 2026-09-03 所有者:「**我不要那个框**」。她朋友那版的卡上**一个框都没有** ——
     ✕ 是光秃秃一个符号、关联列表是纯文字行、底下那颗是实心按钮。
     我们原来三处全套了描边框。**别再把框加回来**(留 34px 是手指的点击范围,不是框)。 */
  #cClose {
    width:34px; height:34px; flex:0 0 auto; display:grid; place-items:center;
    border:0; background:none; padding:0;
    color:var(--drift-faint); font-size:15px; font-weight:300; cursor:pointer;
  }
  #cClose:hover, #cClose:focus-visible { color:var(--drift-ink); outline:none; }
  #cScroll { overflow-y:auto; -webkit-overflow-scrolling:touch; min-width:0; }
  /* 正文是**唯一**保留框的一块(2026-09-03 所有者:「正文的部分是有一个和底色相近的
     玻璃质感框的」)。⚠️ 关键在「和底色相近」:它不是描边框,是**比卡片底再提亮一点点**的
     一层玻璃 —— 只够把正文和下面的关联列表分开,不够到看起来像另一张卡。
     别给它加 `border`,一描边就变回上面那三处被她砍掉的框了。 */
  #cBody {
    padding:17px; border-radius:17px;
    background:var(--drift-sheet);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    color:var(--drift-dim); font-size:13.5px; line-height:1.8; white-space:pre-wrap; word-break:break-word;
  }
  /* 标签(2026-09-03 所有者:「不要那么有安卓味,按苹果 ui 设计走」)。
     安卓味来自哪儿:实心高饱和的大色块 + 描边胶囊,一个标签恨不得有三层装饰。
     苹果的做法只有两条 ——
       ① 分类标签 = 强调色本身,加一层**同色的极淡底**(≈13% 透明),不描边、不实心;
       ② 日期不是标签,就是一句次要文字,和标签并排。所以这里没有第二个胶囊。
     颜色直接取 --drift-signal(她亲手拖的那个),不另配色。 */
  #cTags { margin-top:6px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; }
  #cTags .c-tag {
    padding:4px 11px; border-radius:var(--r-pill, 999px);
    background:rgba(var(--drift-signal),.13); color:rgb(var(--drift-signal));
    font-size:12.5px; font-weight:500; line-height:1.5; letter-spacing:.01em;
  }
  #cNear { margin-top:17px; }
  #cNear > b { display:block; margin-bottom:9px; color:rgb(var(--drift-signal)); font-size:11.5px; font-weight:500; letter-spacing:.08em; }
  /* 一行一条的纯文字行:左边灰色的关系名,右边加粗的标题(照她朋友那版)。
     ⚠️ 右边那格必须写 `minmax(0,1fr)`,**不能只写 `1fr`** —— `1fr` 等于 `minmax(auto,1fr)`,
     那个 auto 下限就是内容宽度,`session_2026-07-01_…` 那种长标题照样撑破卡片。 */
  #cNear > div { display:flex; flex-direction:column; }
  #cNear button {
    width:100%; padding:7px 0; display:grid; grid-template-columns:auto minmax(0,1fr);
    align-items:baseline; gap:10px; text-align:left;
    border:0; background:none; color:var(--drift-ink); font-family:inherit; cursor:pointer;
  }
  #cNear button:hover strong, #cNear button:focus-visible strong { color:rgb(var(--drift-signal)); }
  #cNear button:focus-visible { outline:none; }
  #cNear strong { overflow:hidden; font-size:13px; font-weight:600; text-overflow:ellipsis; white-space:nowrap; }
  #cNear em { font-style:normal; font-size:12.5px; color:var(--drift-faint); }
  /* 日期:纯文字,不做成第二个胶囊(苹果的卡片抬头都是这么排的) */
  #cTags .c-date { color:var(--drift-faint); font-size:12.5px; letter-spacing:.02em; }
  #cOpen {
    margin-top:18px; display:block; padding:14px; text-align:center;
    border:0; border-radius:var(--r-pill, 999px);
    background:rgba(var(--drift-signal),.13); color:rgb(var(--drift-signal));
    font-size:14px; font-weight:600; text-decoration:none;
  }
  /* ⚠️ 2026-09-03 所有者定的:「**改成和恋爱那个按钮一样的,黑白两版本都改成那个样的**」——
     就是上面那颗标签的做法:**同色的极淡底(.13)+ 强调色的字,不描边**。
     深浅两套自动跟着 `--drift-signal` 走,**别再给它单独配底色或字色**
     (灰底白字那版、signal 实心底那版都是她否掉的)。 */
  #cOpen:hover { opacity:.85; }
  #cNear small { color:var(--drift-faint); font-size:8px; }
  /* ⚠️ 窄屏上关系名太长会把标题挤没,所以叠成两行(宽屏才并排)。 */
  @media (max-width:380px) {
    #cNear button { grid-template-columns:minmax(0,1fr); gap:1px; }
    #cNear em { font-size:9.5px; }
  }

  /* 加载中 / 口令门 */
  #loading, #gate {
    position:fixed; inset:0; z-index:6; display:grid; place-items:center; padding:24px;
    background:var(--drift-bg); color:var(--drift-faint); font-size:12px; letter-spacing:.12em;
  }
  #gate { display:none; }
  #gate.on { display:grid; }
  #gate form { width:min(280px,100%); display:grid; gap:11px; text-align:center; }
  #gTitle {
    font-family:ui-serif,Georgia,serif; font-size:19px; letter-spacing:.34em;
    text-indent:.34em; color:var(--drift-ink);
  }
  #gate input {
    width:100%; height:42px; padding:0 13px; border:1px solid var(--drift-line); border-radius:10px;
    background:var(--drift-input); color:var(--drift-ink); font-family:inherit; font-size:14px; text-align:center;
  }
  #gate input:focus { border-color:rgba(var(--drift-signal),.55); outline:none; }
  #gate button {
    height:42px; border:1px solid rgba(var(--drift-signal),.42); border-radius:10px;
    background:rgba(var(--drift-signal),.1); color:rgb(var(--drift-signal));
    font-family:inherit; font-size:13px; cursor:pointer;
  }
  #gate button:disabled { opacity:.5; cursor:default; }
  #gErr { min-height:14px; color:#c96; font-size:11px; letter-spacing:.06em; }

  @media (prefers-reduced-motion: reduce) {
    #card { animation:none; }
    #controls button { transition-property:border-color,color; }
  }
</style>
</head>
<body>

<div id="stage"><canvas id="canvas"></canvas></div>

<a id="exit" href="/dashboard" aria-label="回记忆库后台" title="回记忆库后台">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
</a>

<div id="head">
  <h1 id="hTitle"></h1>
  <p id="hSub"></p>
  <!-- 统计 + 图例:所有者 2026-09-03 照她朋友那版要的。
       ⚠️ 图例说的是**两种线**;第三种(存入时关联到一起)我们取不到,所以图例里也没有它 —— 别加。 -->
  <p id="hStat"></p>
  <!-- ⚠️ **图例默认是收起的,点中一颗字才出来**(所有者 2026-09-03:「我点击才出现下面两行字,
       然后并且有一个数据乱流的动画」)。出场时那两行字先乱码、再一个个定下来 —— 见 revealLegend()。
       文字放在 <b> 里、真身记在 data-text 上:乱码动画要反复改写它,原文得有地方存。 -->
  <div id="legend">
    <span><i class="l-solid"></i><b data-text="说的是相近的事">说的是相近的事</b></span>
    <span><i class="l-dash"></i><b data-text="共享同一个标签">共享同一个标签</b></span>
  </div>
</div>

<p id="hint">点一个字,看它牵着谁</p>

<div id="controls" class="hud">
  <button type="button" data-action="in"    aria-label="放大">＋</button>
  <button type="button" data-action="out"   aria-label="缩小">－</button>
  <button type="button" data-action="reset" aria-label="复位">↺</button>
</div>

<div id="card">
  <header>
    <div>
      <span id="cKind"></span>
      <div id="cName"></div>
      <div id="cTags"></div>
    </div>
    <button type="button" id="cClose" aria-label="关掉">✕</button>
  </header>
  <div id="cScroll">
    <div id="cBody"></div>
    <div id="cNear"><b>牵着的记忆</b><div></div></div>
    <a id="cOpen" href="/dashboard">在面板里打开</a>
  </div>
</div>

<div id="loading">正在把记忆铺开…</div>
<div id="gate">
  <form id="gForm">
    <div id="gTitle"></div>
    <input id="gPass" type="password" autocomplete="current-password" placeholder="口令">
    <button type="submit" id="gGo">进去</button>
    <div id="gErr"></div>
  </form>
</div>

<script>
'use strict';

/* ══ ② 小工具:和原版同一套确定性随机,保证同一批桶每次铺出来一模一样 ══ */
function hashText(s){
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function seededUnit(seed){
  let v = seed || 1;
  return function(){ v = (Math.imul(v, 1664525) + 1013904223) >>> 0; return v / 4294967296; };
}
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

/* 画布用的颜色一律现读 CSS 变量,别写死在 JS 里 —— 写死了切到浅色画出来还是深色那套。
   (和 dashboard.html 的 cssVar() 同一条规矩,见 INTERNALS 1.8)
   每帧 getComputedStyle 太贵,所以缓存;系统深浅色一变、窗口一变就重读。 */
let PALETTE = null;
function readPalette(){
  const cs = getComputedStyle(document.documentElement);
  const pick = (name, fallback) => (cs.getPropertyValue(name).trim() || fallback);
  return {
    bg:     pick('--drift-bg',     '#01050a'),
    signal: pick('--drift-signal', '205,105,111'),
    node:   pick('--drift-node',   '116,128,141'),
    trace:  pick('--drift-trace',  pick('--drift-signal', '205,105,111')),
    traceBoost: parseFloat(pick('--drift-trace-boost', '1')) || 1,
    boost:  parseFloat(pick('--drift-ink-boost', '1')) || 1,
  };
}
function palette(){ return PALETTE || (PALETTE = readPalette()); }

/* OB 的桶 → 原版那套「层」。原版是 core/semantic/episodic/working/archive,
   OB 没有这套东西,所以按 type + pinned + resolved 映射(刻意不一样之三)。 */
function layerOf(b){
  if (b.resolved || b.type === 'archived') return 'archive';
  if (b.pinned || b.importance >= 9)       return 'core';
  if (b.type === 'feel')                   return 'episodic';
  if (b.type === 'permanent')              return 'semantic';
  return 'working';
}
const LAYER_CENTER = {
  core:     [.58, .42],
  semantic: [.62, .52],
  episodic: [.38, .48],
  working:  [.44, .57],
  archive:  [.22, .66],
};
const LAYER_LABEL = {
  core:'CORE · 核心', semantic:'PERMANENT · 长期', episodic:'FEEL · 自省',
  working:'DYNAMIC · 当前', archive:'ARCHIVE · 已了结',
};

/* ══ ③ 铺场:把桶摆成一片字符,再按相似度把相关的拽到一起 ══ */
function makeGraph(items, relations){
  const total = Math.max(CONFIG.minGlyphs, items.length);
  const nodes = [];
  for (let i = 0; i < total; i++) {
    // 超出真实桶数的部分是装饰字符:不可点、不连线、更暗(刻意不一样之一)
    const item = i < items.length ? items[i] : null;
    const seed = hashText(item ? item.id : ('filler:' + i));
    const rnd = seededUnit(seed);
    const center = LAYER_CENTER[item ? layerOf(item) : 'working'];
    const goldenX = (i * .61803398875 + rnd() * .21) % 1;
    const evenY   = (i * .75487766625 + rnd() * .05) % 1;
    nodes.push({
      item: item,
      interactive: !!item,
      x: clamp(goldenX * .86 + center[0] * .14, .018, .982),
      y: evenY,
      depth: .28 + rnd() * .72,
      glyph: CONFIG.glyphs[Math.floor(rnd() * CONFIG.glyphs.length)],
      nextMutation: 420 + rnd() * 780,
    });
  }

  // 边有两种(2026-09-03 加的第二种):
  //   vector = 说的是相近的事(/api/network 的相似度)—— 实线
  //   tag    = 共享同一个标签(桶自带的 domain/tags 现算)—— 虚线
  // ⚠️ 还差一种她朋友那版有的:「存入时关联到一起」(晏写在正文里的 [[链接]])。
  //    **数据在,但取不出来** —— /api/buckets 只给 200 字预览,要它得给后端开新接口,
  //    那会破掉这一页「零新增接口」的性质。2026-09-03 报给所有者了,她没定之前别做。
  const indexById = new Map();
  nodes.forEach((n, i) => { if (n.item) indexById.set(n.item.id, i); });
  const edges = [];
  const seen = new Set();
  relations.forEach(function(r){
    const a = indexById.get(r.source), b = indexById.get(r.target);
    if (a === undefined || b === undefined || a === b) return;
    const key = Math.min(a,b) + ':' + Math.max(a,b);
    if (seen.has(key)) return;
    seen.add(key);
    edges.push({ from:Math.min(a,b), to:Math.max(a,b), sim:r.similarity, kind:'vector' });
  });

  // ── 共享标签的边 ──
  // ⚠️ 两两比是 O(n²);改成按标签建索引。**太大的标签组直接跳过** ——
  //    「日常」这种几乎人人都有的标签,连起来就是一团糊,既慢又没信息量。
  //    每个桶最多留 CONFIG.tagEdgesPerNode 条,按「共享几个标签」排。
  const byTag = new Map();
  nodes.forEach((n, i) => {
    if (!n.item) return;
    [...(n.item.domain || []), ...(n.item.tags || [])].forEach(t => {
      if (!t) return;
      if (!byTag.has(t)) byTag.set(t, []);
      byTag.get(t).push(i);
    });
  });
  const shared = new Map();   // "a:b" → 共享几个标签
  byTag.forEach((idxs, tag) => {
    if (idxs.length < 2 || idxs.length > CONFIG.tagGroupMax) return;   // 太泛的标签跳过
    for (let x = 0; x < idxs.length; x++) for (let y = x + 1; y < idxs.length; y++) {
      const key = Math.min(idxs[x], idxs[y]) + ':' + Math.max(idxs[x], idxs[y]);
      shared.set(key, (shared.get(key) || 0) + 1);
    }
  });
  const perNode = new Array(nodes.length).fill(0);
  [...shared.entries()]
    .sort((l, r) => r[1] - l[1])
    .forEach(([key, n]) => {
      const [a, b] = key.split(':').map(Number);
      if (seen.has(key)) return;                                   // 已经有相似度边了,不重复连
      if (perNode[a] >= CONFIG.tagEdgesPerNode || perNode[b] >= CONFIG.tagEdgesPerNode) return;
      seen.add(key);
      perNode[a]++; perNode[b]++;
      edges.push({ from:a, to:b, sim:Math.min(.95, .5 + n * .1), kind:'tag', shared:n });
    });

  // 排序:相似度边优先(实线在前),同类按相似度从高到低
  edges.sort((l, r) => (l.kind === r.kind ? r.sim - l.sim : (l.kind === 'vector' ? -1 : 1)));

  // 相似的先拽到一起
  edges.forEach(function(e, i){
    const anchor = nodes[e.from], follower = nodes[e.to];
    const rnd = seededUnit(hashText(anchor.item.id + ':' + follower.item.id + ':' + i));
    const radius = e.sim >= .75 ? .038 + rnd() * .035 : .052 + rnd() * .045;
    const angle  = rnd() * Math.PI * 2;
    follower.x = clamp(anchor.x + Math.cos(angle) * radius, .018, .982);
    follower.y = ((anchor.y + Math.sin(angle) * radius) % 1 + 1) % 1;
  });

  // 再松弛十轮:太挤的推开、连着的拉近(网格分桶,不是两两比,别改成 O(n²))
  const gap = Math.min(.026, .72 / Math.sqrt(nodes.length));
  for (let iter = 0; iter < 10; iter++) {
    const cells = new Map();
    for (let bi = 0; bi < nodes.length; bi++) {
      const second = nodes[bi];
      const cx = Math.floor(second.x / gap), cy = Math.floor(second.y / gap);
      for (let ox = -1; ox <= 1; ox++) for (let oy = -1; oy <= 1; oy++) {
        const near = cells.get((cx+ox) + ':' + (cy+oy));
        if (!near) continue;
        for (let k = 0; k < near.length; k++) {
          const first = nodes[near[k]];
          let dx = second.x - first.x, dy = second.y - first.y;
          let dist = Math.hypot(dx, dy);
          if (dist >= gap) continue;
          if (dist < .0001) {
            const a = seededUnit(hashText(bi + ':' + near[k] + ':' + iter))() * Math.PI * 2;
            dx = Math.cos(a) * .001; dy = Math.sin(a) * .001; dist = .001;
          }
          const push = (gap - dist) * .34;
          const px = dx / dist * push, py = dy / dist * push;
          first.x  = clamp(first.x  - px, .018, .982); first.y  = clamp(first.y  - py, .012, .988);
          second.x = clamp(second.x + px, .018, .982); second.y = clamp(second.y + py, .012, .988);
        }
      }
      const key = Math.floor(second.x / gap) + ':' + Math.floor(second.y / gap);
      if (!cells.has(key)) cells.set(key, []);
      cells.get(key).push(bi);
    }
    edges.forEach(function(e){
      const first = nodes[e.from], second = nodes[e.to];
      const dx = second.x - first.x, dy = second.y - first.y;
      const dist = Math.max(.0001, Math.hypot(dx, dy));
      const target = e.sim >= .75 ? .062 : .086;
      if (dist <= target * 1.18) return;
      const pull = (dist - target) * .025;
      second.x = clamp(second.x - dx / dist * pull, .018, .982);
      second.y = clamp(second.y - dy / dist * pull, .012, .988);
    });
  }

  // 最后把 y 铺匀,免得上飘时一阵密一阵疏
  nodes.slice().sort((l, r) => l.y - r.y).forEach(function(n, i, all){ n.y = (i + .5) / all.length; });

  // ⚠️⚠️ x 也要铺开(2026-09-03 所有者:「**乱码都集中在中间**」)。
  // **病根**:上面「相似的拽到一起」+ 十轮松弛是**只拉不推到边**的,
  // 400 个桶带 2300+ 条边,x 会整体塌向中间 —— 现场量过:**80% 的字符挤在屏幕中间 37% 的宽度里**
  // (p10 = 屏宽 25%、p90 = 62%,两侧几乎是空的)。**y 没这个毛病,因为上面那行按名次铺平过。**
  // **做法**:按名次算一个「铺满全宽」的理想位置,再和现在的位置**按比例混**。
  // ⚠️ **不能像 y 那样直接铺平**(`spreadX = 1`)—— 那会把「相似的挨在一起」整个抹掉,
  //    簇就没了。混合是保序的:**簇还在,只是整体摊开到全宽**。
  // 调 `CONFIG.spreadX`:0 = 回到原来那坨,1 = 完全铺平(不要)。
  if (CONFIG.spreadX > 0) {
    const byX = nodes.slice().sort((l, r) => l.x - r.x);
    byX.forEach(function(n, i, all){
      const even = .018 + (i + .5) / all.length * .964;      // 铺满 [.018,.982],和 clamp 的边界一致
      n.x = n.x * (1 - CONFIG.spreadX) + even * CONFIG.spreadX;
    });
  }

  // 世界铺多大 = 总字符数 / 一屏想看见多少(下限 1:世界不能比一屏还小)
  return { nodes:nodes, edges:edges,
           worldScale:Math.max(1, Math.sqrt(total / CONFIG.visibleGlyphs)) };
}

function makeTraces(count){
  const rnd = seededUnit(50817);
  const out = [];
  for (let i = 0; i < count; i++) {
    out.push({ x:rnd(), y:rnd(), length:.09 + rnd() * .38, speed:.10 + rnd() * .18, alpha:.14 + rnd() * .18 });
  }
  return out;
}

/* ══ ④ 引擎 ══ */
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { alpha:false });
let BUCKETS = [], BY_ID = new Map(), NEIGHBOURS = new Map();

function boot(items, relations){
  document.getElementById('loading').style.display = 'none';
  document.getElementById('hTitle').textContent = CONFIG.title;
  document.getElementById('hSub').textContent   = CONFIG.subtitle;


  const graph = makeGraph(items, relations);
  const nodes = graph.nodes, edges = graph.edges;
  indexData(items, graph.edges, graph.nodes);
  // ⚠️ 数的是**两种线的总和**(相似度 + 共享标签),不是只有 /api/network 那一种
  document.getElementById('hStat').textContent =
    items.length + ' 条记忆 · ' + edges.length + ' 条关联';
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const coarse = window.matchMedia('(pointer: coarse)').matches;
  const worldScale = graph.worldScale;
  const traces = makeTraces(Math.round((coarse ? 34 : 56) * worldScale * worldScale));
  const minScale = Math.max(.12, 1 / worldScale);

  const edgesByNode = nodes.map(() => []);
  edges.forEach(function(e, i){ edgesByNode[e.from].push(i); edgesByNode[e.to].push(i); });

  let W = 0, H = 0, worldW = 0, worldH = 0;
  let scale = 1, panX = 0, panY = 0;
  let pointer = null, drag = null, pinch = null;
  const touches = new Map();
  let running = true, lastFrame = 0, frames = 0;   // frames 只累加,给演练当「动画真的在转」的观察口
  let lockedIndex = null, feedbacks = [];

  const clampScale = v => clamp(v, minScale, 3.2);
  function clampPan(){
    const pad = Math.min(W, H) * .28;
    const mx = Math.max(0, (worldW * scale - W) / 2) + pad;
    const my = Math.max(0, (worldH * scale - H) / 2) + pad;
    panX = clamp(panX, -mx, mx); panY = clamp(panY, -my, my);
  }
  function zoomAround(next, fx, fy){
    const cx = (fx - W / 2 - panX) / scale, cy = (fy - H / 2 - panY) / scale;
    scale = clampScale(next);
    panX = fx - W / 2 - cx * scale; panY = fy - H / 2 - cy * scale;
    clampPan();
  }
  function wrappedY(node, now){
    const travel = reduceMotion ? 0 : now * CONFIG.driftSpeed;
    const span = Math.max(1, worldH);
    const y0 = (node.y - .5) * span;
    return ((y0 + travel + span / 2) % span + span) % span - span / 2;
  }
  function pointOf(node, now){
    return {
      x:(node.x - .5) * worldW * scale + W / 2 + panX,
      y:wrappedY(node, now) * scale + H / 2 + panY,
    };
  }
  function nearestAt(x, y, count, now){
    const out = [];
    for (let i = 0; i < nodes.length; i++) {
      const p = pointOf(nodes[i], now);
      const d = Math.hypot(p.x - x, p.y - y);
      let at = -1;
      for (let k = 0; k < out.length; k++) { if (d < out[k].distance) { at = k; break; } }
      if (at < 0) out.push({ index:i, distance:d }); else out.splice(at, 0, { index:i, distance:d });
      if (out.length > count) out.pop();
    }
    return out;
  }

  function draw(now){
    const P = palette();
    ctx.globalAlpha = 1;
    ctx.fillStyle = P.bg;
    ctx.fillRect(0, 0, W, H);

    const points = nodes.map(n => pointOf(n, now));
    const center = lockedIndex !== null ? points[lockedIndex] : pointer;
    const near = center
      ? nearestAt(center.x, center.y, CONFIG.neighborCount, now).filter(e => e.distance < CONFIG.interactRadius)
      : [];
    const anchors = lockedIndex !== null ? [lockedIndex] : near.map(e => e.index);

    // 第一圈:锚点自己的边;第二圈:第一圈邻居再往外一层(都按相似度排过)。
    // ⚠️ **点中一颗(locked)时放得很开,只是手指扫过(hover)时收着** ——
    // 所有者 2026-09-03 拿她朋友那版比:「他们点下去牵出去七八条、横跨大半屏」,
    // 而我们抄原版时带了两条很紧的限制,点下去只亮两三根短线,显得很怯。
    const locked = lockedIndex !== null;
    const cap1 = locked ? (coarse ? 14 : 20) : (coarse ? 7 : 10);
    const cap2 = locked ? (coarse ? 16 : 24) : (coarse ? 8 : 14);
    const firstIdx = [...new Set(anchors.flatMap(i => edgesByNode[i]))].slice(0, cap1);
    const firstSet = new Set(firstIdx);
    const ring1 = new Set();
    firstIdx.forEach(function(ei){ ring1.add(edges[ei].from); ring1.add(edges[ei].to); });
    anchors.forEach(i => ring1.delete(i));
    const secondIdx = [...new Set([...ring1].flatMap(i => edgesByNode[i]))]
      .filter(ei => !firstSet.has(ei) && !anchors.includes(edges[ei].from) && !anchors.includes(edges[ei].to))
      .slice(0, cap2);

    // 多远之内才连线。⚠️ **锁住时放到大半屏**(所有者要的),手指扫过时仍然收着 ——
    // 不收的话光是移动鼠标满屏都在闪线,那才是噪声。
    const lim1 = locked ? Math.hypot(W, H) * .62 : Math.min(170, Math.max(108, W * .2));
    const lim2 = locked ? Math.hypot(W, H) * .42 : Math.min(125, Math.max(82, H * .14));
    const yLim = locked ? H * .9 : H * .24;
    const isLocal = (a, b, limit) => Math.abs(points[a].y - points[b].y) <= yLim
      && Math.hypot(points[a].x - points[b].x, points[a].y - points[b].y) <= limit;

    const lockFb = lockedIndex !== null
      ? feedbacks.slice().reverse().find(f => f.index === lockedIndex && f.kind === 'lock') : null;
    const lockProgress = lockFb ? easeOutCubic(clamp((now - lockFb.startedAt) / 180, 0, 1)) : 1;

    // 背景光迹
    traces.forEach(function(t){
      const len = t.length * H;
      const span = worldH + len;
      const raw = (t.y - .5) * worldH - (reduceMotion ? 0 : now * t.speed);
      const wy = ((raw + worldH / 2 + len) % span + span) % span - len - worldH / 2;
      const x = (t.x - .5) * worldW * scale + W / 2 + panX;
      const y = wy * scale + H / 2 + panY;
      const l = len * scale;
      if (x < -3 || x > W + 3 || y > H + l + 3 || y + l < -3) return;
      // ⚠️ 这四行的算法和校准台(所有者拖数那个页面)里那份**逐字一致**,
      // 改了这儿就等于让她当时看到的和真页面对不上。要改先改两边。
      const a = Math.min(1, t.alpha * P.traceBoost);
      const g = ctx.createLinearGradient(x, y, x, y + l);
      g.addColorStop(0,  'rgba(' + P.trace + ',' + a + ')');
      g.addColorStop(.55,'rgba(' + P.trace + ',' + (a * .5) + ')');
      g.addColorStop(1,  'rgba(' + P.trace + ',0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = a > .23 ? 1.1 : .78;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + l); ctx.stroke();
      ctx.fillStyle = 'rgba(' + P.trace + ',' + Math.min(.46, a * 1.4) + ')';
      ctx.fillRect(x - .5, y - 1, 1, 2);
    });

    const active = new Set(anchors), secondary = new Set();
    if (center) {
      secondIdx.forEach(function(ei){
        const e = edges[ei];
        if (!isLocal(e.from, e.to, lim2)) return;
        secondary.add(e.from); secondary.add(e.to);
        ctx.setLineDash(e.kind === 'tag' ? [3, 5] : []);
        ctx.strokeStyle = 'rgba(' + P.signal + ',' + (.08 * lockProgress) + ')';
        ctx.lineWidth = .45;
        ctx.beginPath(); ctx.moveTo(points[e.from].x, points[e.from].y);
        ctx.lineTo(points[e.to].x, points[e.to].y); ctx.stroke();
        ctx.setLineDash([]);
      });
      firstIdx.forEach(function(ei){
        const e = edges[ei];
        if (!isLocal(e.from, e.to, lim1)) return;
        active.add(e.from); active.add(e.to);
        // ⚠️ 两种线要看得出区别:相似度=实线,共享标签=虚线(和图例对得上)
        ctx.setLineDash(e.kind === 'tag' ? [4, 4] : []);
        ctx.strokeStyle = 'rgba(' + P.signal + ',' +
          ((e.kind === 'tag' ? .2 : .34) * lockProgress) + ')';
        ctx.lineWidth = e.kind === 'tag' ? .5 : .7;
        ctx.beginPath(); ctx.moveTo(points[e.from].x, points[e.from].y);
        ctx.lineTo(points[e.to].x, points[e.to].y); ctx.stroke();
        ctx.setLineDash([]);
      });
      near.forEach(function(e){
        active.add(e.index);
        if (e.distance < 1) return;
        ctx.strokeStyle = 'rgba(' + P.signal + ',' +
          (.5 * (1 - e.distance / CONFIG.interactRadius) * lockProgress) + ')';
        ctx.lineWidth = .5;
        ctx.beginPath(); ctx.moveTo(points[e.index].x, points[e.index].y);
        ctx.lineTo(center.x, center.y); ctx.stroke();
      });
    }
    active.forEach(i => secondary.delete(i));

    // 被点中那颗底下垫一团光(所有者:她朋友那版「选中那颗发红光」;
    // 我们不上色 —— 整套零饱和是她定的,所以这团光就是信号色本身,只是更亮)
    if (lockedIndex !== null && lockProgress > 0) {
      const p = points[lockedIndex];
      if (p.x > -40 && p.x < W + 40 && p.y > -40 && p.y < H + 40) {
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 26);
        g.addColorStop(0, 'rgba(' + P.signal + ',' + (.34 * lockProgress) + ')');
        g.addColorStop(1, 'rgba(' + P.signal + ',0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, 26, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 字符本体
    let visible = 0;
    for (let i = 0; i < nodes.length; i++) {
      const n = nodes[i], p = points[i];
      const isActive = active.has(i), isSecondary = secondary.has(i);
      if (!reduceMotion && now >= n.nextMutation) {
        const rnd = seededUnit(hashText((n.item ? n.item.id : i) + ':' + Math.floor(now / 8)));
        n.glyph = CONFIG.glyphs[Math.floor(rnd() * CONFIG.glyphs.length)];
        n.nextMutation = now + (isActive ? 1 : 420 + rnd() * 780);
      }
      if (p.x < -24 || p.x > W + 24 || p.y < -24 || p.y > H + 24) continue;
      visible++;
      const layer = n.item ? layerOf(n.item) : 'working';
      const isCore = layer === 'core';
      const size = ((isCore ? 12 : 9.75) + n.depth * 1.55) * clamp(scale, .46, 2.1);
      ctx.font = (isCore ? 500 : 400) + ' ' + size + 'px "SFMono-Regular", Menlo, Consolas, monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = isSecondary ? 'rgba(' + P.signal + ',.4)'
        : isActive ? 'rgba(' + P.signal + ',.98)'
        : 'rgba(' + P.node + ',' + Math.min(1,
            (!n.item ? .12 : layer === 'archive' ? .19 : .28 + n.depth * .17) * P.boost) + ')';
      ctx.fillText(n.glyph, p.x, p.y);
    }

    // 选中那颗的四角括号
    feedbacks = feedbacks.filter(function(f){
      const dur = f.kind === 'lock' ? 180 : 160;
      const el = now - f.startedAt;
      if (el >= dur) return false;
      const t = reduceMotion ? 1 : easeOutCubic(clamp(el / dur, 0, 1));
      const p = points[f.index];
      if (!p || p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > H + 30) return true;
      const d   = f.kind === 'lock' ? 16 - t * 7 : 9 + t * 8;
      const arm = f.kind === 'lock' ? 4.5 + t * 1.5 : 6 - t * 1.5;
      const a   = f.kind === 'lock' ? 1 - t * .18 : 1 - t;
      ctx.strokeStyle = 'rgba(' + P.signal + ',' + a + ')';
      ctx.lineWidth = f.kind === 'lock' ? 1 : .75;
      ctx.beginPath();
      ctx.moveTo(p.x-d, p.y-d+arm); ctx.lineTo(p.x-d, p.y-d); ctx.lineTo(p.x-d+arm, p.y-d);
      ctx.moveTo(p.x+d-arm, p.y-d); ctx.lineTo(p.x+d, p.y-d); ctx.lineTo(p.x+d, p.y-d+arm);
      ctx.moveTo(p.x+d, p.y+d-arm); ctx.lineTo(p.x+d, p.y+d); ctx.lineTo(p.x+d-arm, p.y+d);
      ctx.moveTo(p.x-d+arm, p.y+d); ctx.lineTo(p.x-d, p.y+d); ctx.lineTo(p.x-d, p.y+d-arm);
      ctx.stroke();
      return true;
    });

    frames++;
  }

  function loop(now){
    // 手机上限到 30fps:这一页会一直转,别让它把电吃光(原版同样的做法)
    if (running && (!coarse || now - lastFrame >= 32)) { draw(now); lastFrame = now; }
    requestAnimationFrame(loop);
  }

  function resize(){
    const b = canvas.getBoundingClientRect();
    W = b.width; H = b.height;
    worldW = W * worldScale; worldH = H * worldScale;
    const dpr = Math.min(window.devicePixelRatio || 1, coarse ? 1.5 : 2);
    canvas.width  = Math.max(1, Math.round(W * dpr));
    canvas.height = Math.max(1, Math.round(H * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(performance.now());
  }

  /* ── 交互 ── */
  const local = e => { const b = canvas.getBoundingClientRect(); return { x:e.clientX - b.left, y:e.clientY - b.top }; };
  function pinchMetrics(){
    const [a, b] = [...touches.values()];
    if (!a || !b) return null;
    return { cx:(a.x + b.x) / 2, cy:(a.y + b.y) / 2, dist:Math.max(12, Math.hypot(b.x - a.x, b.y - a.y)) };
  }
  function beginPinch(){
    const m = pinchMetrics();
    if (!m) return;
    pinch = { cx:m.cx, cy:m.cy, dist:m.dist, scale:scale, panX:panX, panY:panY };
    pointer = null;
    if (drag) drag.moved = true;
  }
  function hitTest(clientX, clientY){
    const b = canvas.getBoundingClientRect();
    const hit = nearestAt(clientX - b.left, clientY - b.top, 1, performance.now())
      .find(e => nodes[e.index].interactive);
    return hit && hit.distance <= (coarse ? 38 : 26) ? hit.index : null;
  }
  function toggleAt(clientX, clientY){
    const i = hitTest(clientX, clientY);
    if (i !== null) {
      if (lockedIndex === i) {
        feedbacks.push({ index:i, kind:'release', startedAt:performance.now() });
        lockedIndex = null; closeCard();
      } else {
        feedbacks.push({ index:i, kind:'lock', startedAt:performance.now() });
        lockedIndex = i; openCard(nodes[i].item); fadeHint();
      }
      return;
    }
    if (lockedIndex !== null) feedbacks.push({ index:lockedIndex, kind:'release', startedAt:performance.now() });
    lockedIndex = null; closeCard();
  }

  canvas.addEventListener('pointerdown', function(e){
    canvas.setPointerCapture(e.pointerId);
    if (e.pointerType === 'touch') {
      const p = local(e);
      touches.set(e.pointerId, p);
      if (touches.size === 1) { pointer = p; drag = { x:e.clientX, y:e.clientY, panX:panX, panY:panY, moved:false }; }
      else if (touches.size === 2) beginPinch();
      return;
    }
    drag = { x:e.clientX, y:e.clientY, panX:panX, panY:panY, moved:false };
  });
  canvas.addEventListener('pointermove', function(e){
    const p = local(e);
    if (touches.has(e.pointerId)) {
      touches.set(e.pointerId, p);
      if (touches.size >= 2) {
        if (!pinch) beginPinch();
        const m = pinchMetrics();
        if (!pinch || !m) return;
        const cx = (pinch.cx - W / 2 - pinch.panX) / pinch.scale;
        const cy = (pinch.cy - H / 2 - pinch.panY) / pinch.scale;
        scale = clampScale(pinch.scale * m.dist / pinch.dist);
        panX = m.cx - W / 2 - cx * scale; panY = m.cy - H / 2 - cy * scale;
        clampPan(); pointer = null;
        if (drag) drag.moved = true;
        return;
      }
      pointer = p;
      if (drag && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 4) drag.moved = true;
      return;
    }
    pointer = p;
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.hypot(dx, dy) > 4) drag.moved = true;
    panX = drag.panX + dx; panY = drag.panY + dy;
    clampPan();
  });
  canvas.addEventListener('pointerup', function(e){
    if (touches.has(e.pointerId)) {
      const wasPinching = touches.size >= 2 || pinch !== null;
      touches.delete(e.pointerId);
      if (!wasPinching && drag && !drag.moved) toggleAt(e.clientX, e.clientY);
      pinch = null;
      const rest = [...touches.values()][0] || null;
      pointer = rest;
      drag = rest ? { x:rest.x, y:rest.y, panX:panX, panY:panY, moved:true } : null;
      return;
    }
    if (drag && !drag.moved) toggleAt(e.clientX, e.clientY);
    drag = null;
  });
  canvas.addEventListener('pointercancel', function(e){
    touches.delete(e.pointerId);
    if (touches.size < 2) pinch = null;
    pointer = [...touches.values()][0] || null;
    if (touches.size === 0) drag = null;
  });
  canvas.addEventListener('pointerleave', function(){
    if (touches.size > 0) return;
    pointer = null; drag = null;
  });
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    const b = canvas.getBoundingClientRect();
    zoomAround(scale + (e.deltaY < 0 ? .12 : -.12), e.clientX - b.left, e.clientY - b.top);
  }, { passive:false });

  document.getElementById('controls').addEventListener('click', function(e){
    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    if (btn.dataset.action === 'reset') { scale = 1; panX = 0; panY = 0; return; }
    zoomAround(clampScale(scale + (btn.dataset.action === 'in' ? .22 : -.22)), W / 2, H / 2);
    if (btn.dataset.action === 'out' && scale <= minScale + .001) { panX = 0; panY = 0; }
  });

  // 页面看不见就停手,别在后台白转(省电)
  document.addEventListener('visibilitychange', function(){ running = !document.hidden; });
  window.addEventListener('resize', resize);

  // 系统深浅色一变,画布跟着换 —— 页面上的框框靠 CSS 自己就变了,
  // 但画布是 JS 画的,不重读变量的话它会一直停在旧那套颜色上。
  const scheme = window.matchMedia('(prefers-color-scheme: dark)');
  const onScheme = function(){ PALETTE = readPalette(); draw(performance.now()); };
  if (scheme.addEventListener) scheme.addEventListener('change', onScheme);
  else if (scheme.addListener) scheme.addListener(onScheme);   // 老 Safari

  // 关卡片 = 松开锁定
  document.getElementById('cClose').addEventListener('click', function(){
    if (lockedIndex !== null) feedbacks.push({ index:lockedIndex, kind:'release', startedAt:performance.now() });
    lockedIndex = null; closeCard();
  });
  // 卡片里点「离它最近的记忆」→ 跳过去锁住那颗
  document.querySelector('#cNear > div').addEventListener('click', function(e){
    const btn = e.target.closest('button[data-id]');
    if (!btn) return;
    const i = nodes.findIndex(n => n.item && n.item.id === btn.dataset.id);
    if (i < 0) return;
    feedbacks.push({ index:i, kind:'lock', startedAt:performance.now() });
    lockedIndex = i; openCard(nodes[i].item);
  });

  // 演练用的观察口(照 galaxy.html 的 window.__galaxy 那套)。只读 + 一个 lockAt,
  // 页面自己一处都不用它;没有它的话测试只能靠盲点画布,点不准。
  // 点过一次就把底部那句引导淡掉 —— 它只在你还不知道怎么用的时候才有用
  const hintEl = document.getElementById('hint');
  const fadeHint = () => { if (hintEl) hintEl.classList.add('gone'); };

  window.__drift = {
    ob: true,
    count: items.length,                 // 真桶数
    glyphs: nodes.length,                // 场里的字符总数(含填充的装饰字符)
    edges: edges.length,
    node: i => ({ id:nodes[i].item && nodes[i].item.id, interactive:nodes[i].interactive }),
    point: i => pointOf(nodes[i], performance.now()),
    locked: () => (lockedIndex === null ? null : (nodes[lockedIndex].item || {}).id),
    lockAt: function(i){
      feedbacks.push({ index:i, kind:'lock', startedAt:performance.now() });
      lockedIndex = i;
      openCard(nodes[i].item);
    },
    clear: function(){ lockedIndex = null; closeCard(); },
    scale: () => scale,
    frames: () => frames,      // 只增不减:演练拿它判「动画真的在转」(原来是读屏幕上那块 FPS)
  };

  resize();
  requestAnimationFrame(loop);
}

/* ══ ⑤ 点中一颗之后那张卡 ══ */
/* ══ 图例:点中一颗才出来,出场时走一段「数据乱流」 ══
   所有者 2026-09-03 的原话:「**我点击才出现下面两行字,然后并且有一个数据乱流的动画**」。
   做法:每个字先在字符表里乱跳,再**从左往右一个个定下来**(和这一页满屏的字符场是同一套字)。
   ⚠️ **别改成整段淡入** —— 她要的就是"乱流"这个动作。
   ⚠️ 系统开了「减少动态效果」就直接落到原文,不跳字(同这一页别处的 reduceMotion 规矩)。
   ⚠️ 每次出场都要**先取消上一轮**(legendTimers),不然连点两下会有两轮抢着改同一段字。 */
let legendTimers = [];
function stopLegendScramble(){
  legendTimers.forEach(id => cancelAnimationFrame(id));
  legendTimers = [];
}
function scrambleText(el, ms){
  const text = el.dataset.text || el.textContent;
  const pool = CONFIG.glyphs;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = text; return; }
  const startedAt = performance.now();
  const step = function(now){
    const t = Math.min(1, (now - startedAt) / ms);
    // 定下来的字数从左往右推进;还没定的那些每帧换一个乱码
    const settled = Math.floor(t * text.length);
    let out = text.slice(0, settled);
    for (let i = settled; i < text.length; i++) {
      out += text[i] === ' ' ? ' ' : pool[Math.floor(Math.random() * pool.length)];
    }
    el.textContent = out;
    if (t < 1) legendTimers.push(requestAnimationFrame(step));
    else el.textContent = text;
  };
  legendTimers.push(requestAnimationFrame(step));
}
function revealLegend(){
  const box = document.getElementById('legend');
  if (!box || box.classList.contains('on')) return;
  box.classList.add('on');
  stopLegendScramble();
  [...box.querySelectorAll('b')].forEach((el, i) => scrambleText(el, 460 + i * 140));
}
function hideLegend(){
  const box = document.getElementById('legend');
  if (!box) return;
  stopLegendScramble();
  box.classList.remove('on');
  [...box.querySelectorAll('b')].forEach(el => { el.textContent = el.dataset.text || el.textContent; });
}

function closeCard(){ document.getElementById('card').classList.remove('on'); hideLegend(); }
function openCard(item){
  revealLegend();          // ⚠️ 图例跟着「点中了一颗」走,不跟着悬停走
  if (!item) return;
  const card = document.getElementById('card');
  document.getElementById('cKind').textContent = LAYER_LABEL[layerOf(item)] || '';
  document.getElementById('cName').textContent = item.name || item.id;
  document.getElementById('cBody').textContent = item.content != null
    ? item.content : (item.preview || '正在取正文…');
  const tags = document.getElementById('cTags');
  tags.innerHTML = '';
  (item.domain || []).forEach(function(d){
    const s = document.createElement('span');
    s.className = 'c-tag'; s.textContent = d; tags.appendChild(s);
  });
  if (item.created) {
    const d = new Date(item.created);
    if (!isNaN(d)) {
      const s = document.createElement('span');
      s.className = 'c-date';
      s.textContent = (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
      tags.appendChild(s);
    }
  }
  // 「在面板里打开」:跳回后台并直接展开这一条(靠 dashboard.html 认的 #bucket= 锚点)
  const open = document.getElementById('cOpen');
  open.href = '/dashboard#bucket=' + encodeURIComponent(item.id);

  // 离它最近的:直接用 /api/network 那批边,不另算
  const box = document.querySelector('#cNear > div');
  const all = NEIGHBOURS.get(item.id) || [];
  const list = all.slice(0, 8);
  box.innerHTML = '';
  document.getElementById('cNear').style.display = list.length ? '' : 'none';
  // 抬头写清一共牵着几条、这儿列了几条(照她朋友那版:「牵着 9 条记忆(列前 8 条)」)
  const nearHead = document.querySelector('#cNear > b');
  nearHead.textContent = all.length > list.length
    ? '牵着 ' + all.length + ' 条记忆(列前 ' + list.length + ' 条)'
    : '牵着 ' + all.length + ' 条记忆';
  list.forEach(function(n){
    const b = BY_ID.get(n.id);
    if (!b) return;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.dataset.id = n.id;
    // ⚠️ 每条标出**是哪种关系**,和图上的实线/虚线、以及抬头的图例三处对得上
    const kind = document.createElement('em'); kind.textContent = KIND_LABEL[n.kind] || '';
    const strong = document.createElement('strong'); strong.textContent = b.name || n.id;
    btn.appendChild(kind); btn.appendChild(strong);
    box.appendChild(btn);
  });

  card.classList.add('on');
  document.getElementById('cScroll').scrollTop = 0;

  // 正文点中才取(和 /galaxy 同一个做法:铺场时不拉正文)
  if (item.content == null) {
    fetch(CONFIG.obDetail + encodeURIComponent(item.id), { credentials:'same-origin' })
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .then(function(d){
        item.content = d.content || '(这颗记忆是空的)';
        if (document.getElementById('cName').textContent === (item.name || item.id))
          document.getElementById('cBody').textContent = item.content;
      })
      .catch(function(){
        item.content = item.preview || '(这颗记忆的正文没取回来)';
        document.getElementById('cBody').textContent = item.content;
      });
  }
}

/* ══ ⑥ 取数据 + 口令门(整套照 /galaxy 那版) ══ */
const NEED_LOGIN = 'need-login';

async function loadOB(){
  const r = await fetch(CONFIG.obBuckets, { credentials:'same-origin' });
  if (r.status === 401) throw new Error(NEED_LOGIN);
  if (!r.ok) throw new Error('OB ' + r.status);
  const raw = await r.json();
  if (!Array.isArray(raw) || !raw.length) throw new Error('OB 没有记忆');

  const items = raw.filter(function(b){
    if (!CONFIG.includeFeel && b.type === 'feel') return false;
    if (!CONFIG.includeResolved && b.resolved) return false;
    return true;
  }).map(function(b){
    return {
      id:b.id, name:b.name || b.id, type:b.type || 'dynamic',
      domain:b.domain || [], tags:b.tags || [],   // tags 是「共享标签」那种线要用的
      created:b.created || b.last_active || '',
      importance:(b.importance == null ? 5 : b.importance),
      pinned:!!b.pinned, resolved:!!b.resolved,
      preview:b.content_preview || '', content:null,   // 正文点中才取
    };
  });
  if (!items.length) throw new Error('筛完一个不剩');

  // 连线单独一条接口。⚠️ 它要现算相似度(438 桶实测约 1.3 秒,见 INTERNALS 1.10),
  // 所以取不到就当没有边 —— 场照样铺得出来,只是凑近了不亮线。
  let relations = [];
  try {
    const n = await fetch(CONFIG.obNetwork, { credentials:'same-origin' });
    if (n.ok) {
      const j = await n.json();
      if (j && Array.isArray(j.edges)) relations = j.edges;
    }
  } catch (e) { console.info('连线没取到,只铺场：', e); }

  return { items:items, relations:relations };
}

// ⚠️ 邻居表是从**画图用的那张边表**里读的,不再只读 /api/network ——
//    这样「共享标签」那种线也会出现在卡片的「牵着哪些记忆」里,和图上看到的对得上。
function indexData(items, graphEdges, nodes){
  BUCKETS = items;
  BY_ID = new Map(items.map(b => [b.id, b]));
  NEIGHBOURS = new Map();
  const idOf = i => (nodes[i] && nodes[i].item) ? nodes[i].item.id : null;
  graphEdges.forEach(function(e){
    const a = idOf(e.from), b = idOf(e.to);
    if (!a || !b || a === b) return;
    if (!NEIGHBOURS.has(a)) NEIGHBOURS.set(a, []);
    if (!NEIGHBOURS.has(b)) NEIGHBOURS.set(b, []);
    NEIGHBOURS.get(a).push({ id:b, sim:e.sim, kind:e.kind });
    NEIGHBOURS.get(b).push({ id:a, sim:e.sim, kind:e.kind });
  });
  // 相似度边排前面,同类按分数从高到低
  NEIGHBOURS.forEach(list => list.sort((l, r) =>
    (l.kind === r.kind ? r.sim - l.sim : (l.kind === 'vector' ? -1 : 1))));
}
const KIND_LABEL = { vector:'说的是相近的事', tag:'共享同一个标签' };

// 口令门:只做一件事,把口令交给 OB 已有的 /auth/login 换一块 cookie。
// 口令不存、不缓存、不出这一页;登录状态是 OB 那块 cookie,跟记忆库后台同一把锁。
function askPassword(){
  return new Promise(function(resolve){
    const gate = document.getElementById('gate'), inp = document.getElementById('gPass'),
          go = document.getElementById('gGo'), err = document.getElementById('gErr');
    document.getElementById('gTitle').textContent = CONFIG.title;
    document.getElementById('loading').style.display = 'none';
    gate.classList.add('on');
    setTimeout(() => inp.focus(), 120);
    document.getElementById('gForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const pwd = inp.value;
      if (!pwd) return;
      go.disabled = true; err.textContent = '';
      try {
        const r = await fetch('auth/login', {
          method:'POST', credentials:'same-origin',
          headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ password:pwd }),
        });
        // 非 2xx 一律当口令不对:OB 对含非 ASCII 字符的口令会回 500 而不是 401
        // (2026-08-29 实测,是 OB 本来就有的毛病,已报备所有者;见 INTERNALS 1.9 末尾)
        if (!r.ok) { err.textContent = '口令不对'; go.disabled = false; inp.select(); return; }
        const d = await loadOB();
        gate.classList.remove('on'); inp.value = '';
        document.getElementById('loading').style.display = '';
        resolve(d);
      } catch (e2) {
        err.textContent = '连不上记忆库,稍后再来 ♡';
        go.disabled = false;
      }
    });
  });
}

(async function(){
  try {
    let d;
    try { d = await loadOB(); }
    catch (e) {
      if (e.message !== NEED_LOGIN) throw e;
      d = await askPassword();
    }
    boot(d.items, d.relations);
  } catch (e) {
    document.getElementById('loading').textContent = '记忆没铺开,稍后再来 ♡';
    console.error(e);
  }
})();
</script>
